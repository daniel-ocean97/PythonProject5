name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:  # Добавьте эту секцию
          python-version: '3.13'  # И укажите версию Python
      - run: pip install flake8 black
      - run: black .
      - run: flake8 . --count --show-source --statistics
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Check out code
      uses: actions/checkout@v4  # Обновите до v4 для consistency

    - name: Set up Python
      uses: actions/setup-python@v5  # Обновите до v5
      with:
        python-version: '3.13'  # Добавьте кавычки для consistency

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        coverage erase  # Очистка предыдущих данных coverage
        coverage run --source="." manage.py test
        coverage report

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4  # Обновите до v4

      - name: Log in Docker hub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Deploy to Server
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
      run: |
        # Сохраняем SSH ключ в файл
        echo "$SSH_KEY" > private_key
        chmod 600 private_key
        
        # Убеждаемся, что файл содержит корректный ключ
        if ! ssh-keygen -l -f private_key >/dev/null 2>&1; then
          echo "ERROR: Invalid SSH private key format"
          exit 1
        fi
        
        # Выполняем команды на сервере через SSH
        ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}
          docker stop myapp || true
          docker rm myapp || true
          docker run -d --name myapp -p 80:8000 ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}
        "
        
        # Удаляем временный файл с ключом
        rm -f private_key
