name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:  # Добавьте эту секцию
          python-version: '3.13'  # И укажите версию Python
      - run: pip install flake8 black
      - run: black .
      - run: flake8 . --count --show-source --statistics
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Check out code
      uses: actions/checkout@v4  # Обновите до v4 для consistency

    - name: Set up Python
      uses: actions/setup-python@v5  # Обновите до v5
      with:
        python-version: '3.13'  # Добавьте кавычки для consistency

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        coverage erase  # Очистка предыдущих данных coverage
        coverage run --source="." manage.py test
        coverage report

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4  # Обновите до v4

      - name: Log in Docker hub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Debug SSH key content
        run: |
          echo "Full key content:"
          echo "${{ secrets.SSH_KEY }}"
          echo ""
          echo "Key length:"
          echo "${{ secrets.SSH_KEY }}" | wc -c
          echo ""
          echo "First 50 chars:"
          echo "${{ secrets.SSH_KEY }}" | head -c 50 | cat -A
          echo ""
          echo "Last 50 chars:"
          echo "${{ secrets.SSH_KEY }}" | tail -c 50 | cat -A

      - name: Clean and setup SSH key
        run: |
      # Очищаем ключ от лишних символов
          echo "${{ secrets.SSH_KEY }}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > private_key
          chmod 600 private_key
      
      # Проверяем содержимое
          echo "Cleaned key first line:"
          head -1 private_key | cat -A
          echo "Cleaned key last line:"
          tail -1 private_key | cat -A

      - name: Setup SSH key
        run: |
        # Сохраняем ключ через heredoc для чистого форматирования
          cat > private_key << 'EOL'
          ${{ secrets.SSH_KEY }}
          EOL
          chmod 600 private_key
        
        # Проверяем что файл создан
          ls -la private_key
          echo "First few lines of key:"
          head -3 private_key

      - name: Deploy to Server
        run: |
        # Используем простую команду без сложного форматирования
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "whoami"
