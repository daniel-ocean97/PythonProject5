name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install flake8 black
      - run: black .
      - run: flake8 . --count --show-source --statistics
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        coverage erase
        coverage run --source="." manage.py test
        coverage report

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in Docker hub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create SSH key file safely
        run: |
          # Создаем ключ напрямую через heredoc
          cat > private_key << 'EOF'
          -----BEGIN OPENSSH PRIVATE KEY-----
          b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
          QyNTUxOQAAACB3F89B/JWLLZW+BnTH2w4jFTKvyDyX7M+ElTey1O63rQAAAKCaqHfPmqh3
          zwAAAAtzc2gtZWQyNTUxOQAAACB3F89B/JWLLZW+BnTH2w4jFTKvyDyX7M+ElTey1O63rQ
          AAAEDTIboVVUrflFbRc1NpzSBSHRt+eb+V/NOYKbVQ6E7XDXcXz0H8lYstlb4GdMfbDiMV
          Mq/IPJfsz4SVN7LU7retAAAAFmRhbmllbEBERVNLVE9QLUxNQkJHUVABAgMEBQYH
          -----END OPENSSH PRIVATE KEY-----

          EOF

          chmod 600 private_key
          echo "Key file created successfully"
          ls -la private_key

      - name: Verify SSH key
        run: |
          # Проверяем ключ
          ssh-keygen -l -f private_key
          echo "Key is valid"

      - name: Test SSH connection
        run: |
          # Простейший тест
          ssh -v -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "echo 'SSH test successful'"